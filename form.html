<!DOCTYPE html>
<html lang="en">
<head>
    <title>User Registration Form</title>
</head>
<body>
    <h1>User Registration Form</h1>
    
    <form>
        <h2>Basic Information</h2>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <h2>Personal Information</h2>

        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>

        <label for="birthdate">Date of Birth:</label>
        <input type="date" id="birthdate" name="birthdate" required>
        <br><br>

        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="">-- Select a Country --</option>
            <option value="india">India</option>
            <option value="usa">United States</option>
            <option value="uk">United Kingdom</option>
            <option value="canada">Canada</option>
            <option value="australia">Australia</option>
        </select>
        <br><br>

        <label for="bio">About You:</label>
        <br>
        <textarea id="bio" name="bio" rows="4" cols="50"></textarea>
        <br><br>

        <h2>Interests:</h2>
        <input type="checkbox" id="sports" name="interests" value="sports">
        <label for="sports">Sports</label>
        <br>

        <input type="checkbox" id="music" name="interests" value="music">
        <label for="music">Music</label>
        <br>

        <input type="checkbox" id="technology" name="interests" value="technology">
        <label for="technology">Technology</label>
        <br>

        <input type="checkbox" id="reading" name="interests" value="reading">
        <label for="reading">Reading</label>
        <br>

        <input type="checkbox" id="travel" name="interests" value="travel">
        <label for="travel">Travel</label>
        <br>

        <input type="checkbox" id="cooking" name="interests" value="cooking">
        <label for="cooking">Cooking</label>
        <br><br>

        <h2>Preferences:</h2>

        <input type="checkbox" id="newsletter" name="newsletter" value="yes">
        <label for="newsletter">Subscribe to newsletter</label>
        <br>

        <input type="checkbox" id="notifications" name="notifications" value="yes">
        <label for="notifications">Receive push notifications</label>
        <br>

        <input type="checkbox" id="terms" name="terms" value="agree" required>
        <label for="terms">I agree to Terms and Conditions</label>
        <br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
